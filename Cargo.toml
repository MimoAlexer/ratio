[package]
name = "solo-tracker"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["form", "json", "multipart", "query"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
hex = "0.4"
futures-util = "0.3"
hmac = "0.12"
maud = { version = "0.27", features = ["axum"] }
percent-encoding = "2"
pulldown-cmark = "0.13"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "json", "migrate", "macros"] }
subtle = "2"
thiserror = "2"
tempfile = "3"
tokio-util = { version="0.7", features=["io"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace","compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
strip = true
lto = "thin"

[profile.dev]
debug = 1
