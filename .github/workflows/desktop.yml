name: Desktop installers
on:
  push:
    paths: ['desktop/**', '.github/workflows/desktop.yml', 'rust-toolchain.toml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml', 'rust-toolchain.toml']
  workflow_dispatch:
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install GTK3 and WebKitGTK 4.1 build and smoke-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev libdbus-1-dev dpkg-dev desktop-file-utils dbus-x11 xvfb xauth xdotool
          rustup show active-toolchain
      - name: Test and build the Linux client
        run: |
          cargo test --locked
          cargo build --release --locked
      - name: Fetch the published Working Set upgrade fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          legacy=working-set_0.1.0_amd64.deb
          gh release download v0.1.0 --repo "$GITHUB_REPOSITORY" --pattern "$legacy" --dir "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP" && echo "31a30dd49bdb4509d98ae2b49e0e95551a36fb3edc14b63f86f12daf98545ee1  $legacy" | sha256sum --check)
      - name: Test fresh install and upgrade on Ubuntu
        run: |
          packaging/linux/build.sh target/release/ratio dist
          for scenario in fresh upgrade; do
            export XDG_DATA_HOME="$RUNNER_TEMP/ratio-$scenario"
            profile="$XDG_DATA_HOME/Ratio"
            if [[ "$scenario" == upgrade ]]; then
              sudo apt-get install -y "$RUNNER_TEMP/working-set_0.1.0_amd64.deb"
              test -x /usr/bin/working-set
              test -f /usr/share/applications/working-set.desktop
              profile="$XDG_DATA_HOME/Working Set"
              mkdir -p "$profile"
              echo retained > "$profile/installer-ci-sentinel"
            fi
            sudo apt-get install -y ./dist/ratio_*_amd64.deb
            ratio --version
            desktop-file-validate /usr/share/applications/ratio.desktop
            test -f /usr/share/icons/hicolor/256x256/apps/ratio.png
            test ! -e /usr/bin/working-set
            test ! -e /usr/share/applications/working-set.desktop
            test ! -e /usr/share/icons/hicolor/256x256/apps/working-set.png
            xvfb-run -a dbus-run-session -- bash -eu -c '
              ratio &
              pid=$!
              trap "kill $pid 2>/dev/null || true" EXIT
              timeout 90 xdotool search --all --onlyvisible --sync --pid "$pid" --name "Ratio.*Connection"
            '
            test -d "$profile/launcher"
            if [[ "$scenario" == fresh ]]; then echo retained > "$profile/installer-ci-sentinel"; fi
            sudo apt-get remove -y ratio
            test ! -e /usr/bin/ratio
            test ! -e /usr/share/applications/ratio.desktop
            test ! -e /usr/share/icons/hicolor/256x256/apps/ratio.png
            test "$(cat "$profile/installer-ci-sentinel")" = retained
          done
          (cd dist && sha256sum *.deb > SHA256SUMS)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Ratio-linux-amd64
          path: desktop/dist/
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    timeout-minutes: 55
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Test and build the native Windows client
        run: |
          cargo test --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Verify NSIS and package the Windows client
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'nsis-3.13.zip'
          $expected = 'ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8'
          $sources = @(
            'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.13/nsis-3.13.zip'
            'https://pilotfiber.dl.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13.zip'
          )
          $verified = $false
          foreach ($source in $sources) {
            try {
              # SourceForge serves a download page to browser-like user agents.
              $response = Invoke-WebRequest $source -UserAgent 'Ratio-CI/1.0' -OutFile $zip -PassThru -TimeoutSec 60 -ErrorAction Stop
              $actual = (Get-FileHash $zip -Algorithm SHA256).Hash
              if ($actual -ne $expected) {
                throw "Expected $expected, received $actual ($((Get-Item $zip).Length) bytes, $($response.Headers['Content-Type']))."
              }
              $verified = $true
              Write-Host "Verified NSIS 3.13 archive from $source"
              break
            } catch {
              Write-Warning "NSIS archive from $source was rejected. $($_.Exception.Message)"
            }
          }
          if (!$verified) { throw 'Could not retrieve the pinned NSIS 3.13 archive from either mirror.' }
          Expand-Archive $zip $env:RUNNER_TEMP
          $nsis = Join-Path $env:RUNNER_TEMP 'nsis-3.13\makensis.exe'
          $objdump = Join-Path $env:ProgramFiles 'LLVM\bin\llvm-objdump.exe'
          python packaging/windows/build.py target/x86_64-pc-windows-msvc/release/ratio.exe dist --makensis $nsis --objdump $objdump
      - name: Test a fresh install on Windows
        shell: powershell
        run: |
          $installer = Get-Item dist/Ratio-*-windows-x64-setup.exe
          ./packaging/windows/smoke.ps1 -Installer $installer.FullName
          "$((Get-FileHash $installer).Hash.ToLowerInvariant())  $($installer.Name)" | Set-Content dist/SHA256SUMS -Encoding ascii
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Ratio-windows-x64
          path: desktop/dist/
          if-no-files-found: error

  windows-upgrade:
    needs: windows
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Ratio-windows-x64
          path: desktop/dist
      - name: Fetch the published Working Set upgrade fixture
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.1.0 --repo $env:GITHUB_REPOSITORY --pattern Working-Set-0.1.0-windows-x64-setup.exe --dir $env:RUNNER_TEMP
      - name: Test the upgrade on a clean Windows worker
        shell: powershell
        run: |
          $installer = Get-Item desktop/dist/Ratio-*-windows-x64-setup.exe
          $legacy = Join-Path $env:RUNNER_TEMP 'Working-Set-0.1.0-windows-x64-setup.exe'
          ./desktop/packaging/windows/smoke.ps1 -Installer $installer.FullName -LegacyInstaller $legacy
