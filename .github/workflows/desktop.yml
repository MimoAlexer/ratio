name: Desktop installers
on:
  push:
    paths: ['desktop/**', '.github/workflows/desktop.yml', 'rust-toolchain.toml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml', 'rust-toolchain.toml']
  workflow_dispatch:
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install GTK3 and WebKitGTK 4.1 build and smoke-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev libdbus-1-dev dpkg-dev desktop-file-utils dbus-x11 xvfb xauth xdotool
          rustup show active-toolchain
      - name: Test and build the Linux client
        run: |
          cargo test --locked
          cargo build --release --locked
      - name: Package and open the installed application
        run: |
          packaging/linux/build.sh target/release/working-set dist
          sudo apt-get install -y ./dist/working-set_*_amd64.deb
          working-set --version
          desktop-file-validate /usr/share/applications/working-set.desktop
          xvfb-run -a dbus-run-session -- bash -eu -c '
            working-set &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            timeout 90 xdotool search --all --onlyvisible --sync --pid "$pid" --name "Working Set.*Connection"
          '
          profile="${XDG_DATA_HOME:-$HOME/.local/share}/Working Set"
          touch "$profile/installer-ci-sentinel"
          sudo dpkg --remove working-set
          test ! -e /usr/bin/working-set
          test ! -e /usr/share/applications/working-set.desktop
          test -f "$profile/installer-ci-sentinel"
          (cd dist && sha256sum *.deb > SHA256SUMS)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Working-Set-linux-amd64
          path: desktop/dist/
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    timeout-minutes: 55
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Test and build the native Windows client
        run: |
          cargo test --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Verify NSIS and package the Windows client
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'nsis-3.13.zip'
          Invoke-WebRequest 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13.zip' -OutFile $zip
          if ((Get-FileHash $zip).Hash -ne 'ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8') { throw 'NSIS SHA-256 mismatch' }
          Expand-Archive $zip $env:RUNNER_TEMP
          $nsis = Join-Path $env:RUNNER_TEMP 'nsis-3.13\makensis.exe'
          $objdump = Join-Path $env:ProgramFiles 'LLVM\bin\llvm-objdump.exe'
          python packaging/windows/build.py target/x86_64-pc-windows-msvc/release/working-set.exe dist --makensis $nsis --objdump $objdump
      - name: Exercise the installer, rendered connection form, and uninstaller
        shell: powershell
        run: |
          $installer = Get-Item dist/*-setup.exe
          ./packaging/windows/smoke.ps1 $installer.FullName
          "$((Get-FileHash $installer).Hash.ToLowerInvariant())  $($installer.Name)" | Set-Content dist/SHA256SUMS -Encoding ascii
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Working-Set-windows-x64
          path: desktop/dist/
          if-no-files-found: error
