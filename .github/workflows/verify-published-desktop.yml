name: Verify published Windows installer
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published Ratio release tag
        required: true
        default: v0.4.1
        type: string
permissions:
  contents: read
jobs:
  windows-release:
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON((github.event.release.tag_name || inputs.tag) == 'v0.1.1' && '["fresh", "working-set-upgrade"]' || '["fresh", "working-set-upgrade", "ratio-upgrade"]') }}
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Fetch and check the private release bytes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Expected a release tag such as v0.4.1' }
          $version = $env:RELEASE_TAG.Substring(1)
          $exe = "Ratio-$version-windows-x64-setup.exe"
          $dir = Join-Path $env:RUNNER_TEMP 'published-ratio'
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern $exe --pattern SHA256SUMS --dir $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pattern = '^([a-fA-F0-9]{64})\s+\*?' + [regex]::Escape($exe) + '$'
          $hashLine = @(Get-Content (Join-Path $dir SHA256SUMS) | Where-Object { $_ -match $pattern })
          if ($hashLine.Count -ne 1 -or $hashLine[0] -notmatch $pattern) { throw 'Missing or ambiguous release checksum' }
          $expected = $Matches[1]
          if ((Get-FileHash (Join-Path $dir $exe)).Hash -ne $expected) { throw 'Release checksum mismatch' }
          "VERIFIED_SETUP=$(Join-Path $dir $exe)" >> $env:GITHUB_ENV
      - name: Fetch the published Working Set upgrade fixture
        if: matrix.scenario == 'working-set-upgrade'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = 'Working-Set-0.1.0-windows-x64-setup.exe'
          gh release download v0.1.0 --repo $env:GITHUB_REPOSITORY --pattern $name --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "LEGACY_SETUP=$(Join-Path $env:RUNNER_TEMP $name)" >> $env:GITHUB_ENV
      - name: Fetch the published Ratio upgrade fixture
        if: matrix.scenario == 'ratio-upgrade'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          $previousVersion = switch ($env:RELEASE_TAG) {
            'v0.2.0' { '0.1.1' }
            'v0.2.1' { '0.2.0' }
            'v0.3.0' { '0.2.1' }
            'v0.3.1' { '0.3.0' }
            'v0.4.0' { '0.3.1' }
            default { '0.4.0' }
          }
          $name = "Ratio-$previousVersion-windows-x64-setup.exe"
          gh release download "v$previousVersion" --repo $env:GITHUB_REPOSITORY --pattern $name --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PREVIOUS_RATIO_SETUP=$(Join-Path $env:RUNNER_TEMP $name)" >> $env:GITHUB_ENV
      - name: Test the published installer and its default user profile
        shell: powershell
        run: ./desktop/packaging/windows/smoke.ps1 -Installer $env:VERIFIED_SETUP -LegacyInstaller $env:LEGACY_SETUP -PreviousRatioInstaller $env:PREVIOUS_RATIO_SETUP
