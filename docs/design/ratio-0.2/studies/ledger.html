const dataset=[{"id": 18, "title": "Index a vault on first open", "kind": "Feature", "status": "done", "updated": 26, "next": "", "priority": "Normal"}, {"id": 19, "title": "Keep note IDs stable across renames", "kind": "Bug", "status": "done", "updated": 25, "next": "", "priority": "Normal"}, {"id": 20, "title": "Skip unchanged files on rescan", "kind": "Maintenance", "status": "done", "updated": 22, "next": "", "priority": "Normal"}, {"id": 21, "title": "Preserve heading links on export", "kind": "Bug", "status": "done", "updated": 21, "next": "", "priority": "Normal"}, {"id": 22, "title": "Show indexing progress for large vaults", "kind": "Feature", "status": "done", "updated": 17, "next": "", "priority": "Normal"}, {"id": 23, "title": "Read the previous vault format", "kind": "Feature", "status": "done", "updated": 13, "next": "", "priority": "Normal"}, {"id": 24, "title": "Copy attachments during migration", "kind": "Feature", "status": "done", "updated": 10, "next": "", "priority": "Normal"}, {"id": 25, "title": "Report interrupted migrations", "kind": "Bug", "status": "done", "updated": 6, "next": "", "priority": "Normal"}, {"id": 26, "title": "Restore the vault after a canceled upgrade", "kind": "Maintenance", "status": "done", "updated": 4, "next": "", "priority": "Normal"}, {"id": 27, "title": "Verify migrated vaults on reopen", "kind": "Maintenance", "status": "in_progress", "updated": 8, "next": "Reopen the migrated fixture and compare the original note IDs.", "priority": "High"}, {"id": 28, "title": "Keep aliases when importing notes", "kind": "Feature", "status": "done", "updated": 7, "next": "", "priority": "Normal"}, {"id": 29, "title": "Show missing attachments in the import report", "kind": "Bug", "status": "done", "updated": 1, "next": "", "priority": "Normal"}, {"id": 30, "title": "Add a read-only vault preview", "kind": "Feature", "status": "backlog", "updated": 11, "next": "Revisit after the public beta.", "priority": "Normal"}, {"id": 31, "title": "Document the recovery steps", "kind": "Maintenance", "status": "done", "updated": 2, "next": "", "priority": "Normal"}, {"id": 32, "title": "Rebuild stale backlinks", "kind": "Bug", "status": "in_progress", "updated": 1, "next": "Rename the linked note twice and verify the original backlink disappears.", "priority": "High"}, {"id": 33, "title": "Prepare the beta invitation", "kind": "Feature", "status": "ready", "updated": 8, "next": "Check the invitation against the beta entry criteria.", "priority": "Normal"}, {"id": 34, "title": "Reject unsafe paths in archive imports", "kind": "Security", "status": "ready", "updated": 3, "next": "Review the archive validation change and rerun the import checks.", "priority": "Urgent"}, {"id": 35, "title": "Run the public beta acceptance checks", "kind": "Maintenance", "status": "ready", "updated": 2, "next": "Once storage and archive checks pass, sign off the beta checklist.", "priority": "High"}, {"id": 36, "title": "Publish the release notes", "kind": "Feature", "status": "backlog", "updated": 5, "next": "Collect the beta feedback before writing the final notes.", "priority": "Normal"}];
