<div class="app"><aside class="master" aria-label="Issue navigator"><div class="master-title"><h1>Issues</h1><span class="tally" id="issue-count"></span></div><div class="switch" aria-label="Scope"><button data-scope="open" aria-pressed="true">Open</button><button data-scope="done" aria-pressed="false">Completed</button></div><div class="search-panel" hidden><input type="search" aria-label="Find by title or issue key" placeholder="Title or issue key"><button id="close-search" aria-label="Close search">×</button></div><div class="list" id="list"></div><footer class="list-status"><kbd>↑</kbd><kbd>↓</kbd> Select issue</footer></aside>

<script>
const icons={project:'<path d="m3 6 5-3 5 3v6l-5 3-5-3zM3.2 6l4.8 3 4.8-3M8 9v6"/>',search:'<circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.4 3.4"/>',split:'<rect x="2" y="3" width="12" height="10" rx="1.3"/><path d="M6 3v10"/>',prev:'<path d="m10 4-4 4 4 4"/>',next:'<path d="m6 4 4 4-4 4"/>',back:'<path d="M13 8H3m4-4L3 8l4 4"/>',pin:'<path d="M4.5 2.5h7v11L8 11l-3.5 2.5z"/>',bug:'<path d="M5.5 5.5 4 3m6.5 2.5L12 3M4.5 7 2.7 6m1.8 3H2m2.8 2.4L3 13m8.5-6L13.3 6m-1.8 3H14m-2.8 2.4L13 13"/><rect x="4.5" y="5" width="7" height="9" rx="3.3"/>',priority:'<path d="M3 13v-2m4 2V8m4 5V4" stroke-width="2.3"/>',type:'<path d="M2.5 3.5h5.8l5.2 5.2-5 5-6-6z"/><circle cx="6" cy="6.6" r=".5"/>',arrow:'<path d="M2 8h11m-4-4 4 4-4 4"/>',turn:'<path d="M3 12V7.5C3 6 4 5 5.5 5H13m-3-3 3 3-3 3"/>',clock:'<circle cx="8" cy="8" r="5.7"/><path d="M8 4.8v3.6l2.3 1.3"/>',pencil:'<path d="m3 10 7.5-7.5 3 3L6 13l-3.7.7z"/>',note:'<path d="M3 2.5h7l3 3V14H3zM10 2.7V6h3M5.5 8.5h5m-5 2.4h4"/>',status:'<circle cx="8" cy="8" r="5"/><path d="m7 5 3 3-3 3"/>',plus:'<circle cx="8" cy="8" r="5.5"/><path d="M8 5.5v5m-2.5-2.5h5"/>',link:'<path d="m7 5 2-2a3 3 0 0 1 4 4l-2 2m-2 2-2 2a3 3 0 0 1-4-4l2-2m1 3 4-4"/>'};
const icon=k=>'<svg viewBox="0 0 16 16" aria-hidden="true">'+(icons[k]||'')+'</svg>';
document.querySelectorAll('i[data-icon]').forEach(i=>{i.outerHTML=icon(i.dataset.icon).replace('<svg ','<svg class="'+i.className+'" ')});
const data=[{"n":18,"title":"Index a vault on first open","kind":"feature","history":[[-36,"ready"],[-31,"in_progress"],[-26,"done"]],"next":""},{"n":19,"title":"Keep note IDs stable across renames","kind":"bug","history":[[-35,"ready"],[-28,"in_progress"],[-25,"done"]],"next":""},{"n":20,"title":"Skip unchanged files on rescan","kind":"maintenance","history":[[-31,"ready"],[-26,"in_progress"],[-22,"done"]],"next":""},{"n":21,"title":"Preserve heading links on export","kind":"bug","history":[[-30,"ready"],[-25,"in_progress"],[-21,"done"]],"next":""},{"n":22,"title":"Show indexing progress for large vaults","kind":"feature","history":[[-28,"ready"],[-24,"in_progress"],[-17,"done"]],"next":""},{"n":23,"title":"Read the previous vault format","kind":"feature","history":[[-19,"ready"],[-15,"in_progress"],[-13,"done"]],"next":""},{"n":24,"title":"Copy attachments during migration","kind":"feature","history":[[-17,"ready"],[-14,"in_progress"],[-10,"done"]],"next":""},{"n":25,"title":"Report interrupted migrations","kind":"bug","history":[[-16,"ready"],[-11,"in_progress"],[-6,"done"]],"next":""},{"n":26,"title":"Restore the vault after a canceled upgrade","kind":"maintenance","history":[[-15,"ready"],[-10,"in_progress"],[-4,"done"]],"next":""},{"n":27,"title":"Verify migrated vaults on reopen","kind":"maintenance","history":[[-26,"ready"],[-8,"in_progress"]],"next":"Reopen the migrated fixture and compare the original note IDs."},{"n":28,"title":"Keep aliases when importing notes","kind":"feature","history":[[-15,"ready"],[-9,"in_progress"],[-7,"done"]],"next":""},{"n":29,"title":"Show missing attachments in the import report","kind":"bug","history":[[-12,"ready"],[-8,"in_progress"],[-5,"done"],[-3,"in_progress"],[-1,"done"]],"next":""},{"n":30,"title":"Add a read-only vault preview","kind":"feature","history":[[-11,"backlog"]],"next":"Revisit after the public beta."},{"n":31,"title":"Document the recovery steps","kind":"maintenance","history":[[-9,"ready"],[-6,"in_progress"],[-2,"done"]],"next":""},{"n":32,"title":"Rebuild stale backlinks","kind":"bug","history":[[-11,"ready"],[-5,"in_progress"]],"next":"Rename the linked note twice and verify the original backlink disappears."},{"n":33,"title":"Prepare the beta invitation","kind":"feature","history":[[-8,"ready"]],"next":"Check the invitation against the beta entry criteria."},{"n":34,"title":"Reject unsafe paths in archive imports","kind":"security","history":[[-3,"ready"]],"next":"Review the archive validation change and rerun the import checks."},{"n":35,"title":"Run the public beta acceptance checks","kind":"maintenance","history":[[-6,"backlog"],[-2,"ready"]],"next":"Once storage and archive checks pass, sign off the beta checklist."},{"n":36,"title":"Publish the release notes","kind":"feature","history":[[-5,"backlog"]],"next":"Collect the beta feedback before writing the final notes."}];
const names={in_progress:'In progress',ready:'Ready',backlog:'Backlog',done:'Completed'};
const kinds={bug:'Bug',feature:'Feature',maintenance:'Maintenance',security:'Security'};
const groupOrder=['in_progress','ready','backlog','done'];
const priority=n=>n===34?'Urgent':[27,32,35].includes(n)?'High':'Normal';
const descriptions={27:'Compare the note identifiers, attachments and backlinks before and after a full shutdown.',32:'A second note rename leaves an obsolete backlink in the incremental index.',34:'Manual security review found an import validation gap. The beta depends on checking the archive fix.',35:'The beta opens when migration verification and archive validation are both complete.'};
const status=r=>r.history.at(-1)[1];
const mark=s=>'<span aria-hidden="true" class="state '+({in_progress:'active',backlog:'backlog',done:'done'}[s]||'')+'"></span>';
const ages=n=>n===0?'Just now':n===1?'Yesterday':n+' days ago';
const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
let scope='open', selected=32, term='',tab='history',editing=false;
const current=()=>data.find(r=>r.n===selected);
function rows(){return data.filter(r=>(scope==='open'?status(r)!=='done':status(r)==='done')&&('lu-'+r.n+' '+r.title).toLowerCase().includes(term)).sort((a,b)=>groupOrder.indexOf(status(a))-groupOrder.indexOf(status(b))||(a.n===32?-1:b.n===32?1:a.n===34?-1:b.n===34?1:b.n-a.n))}
function renderList(){
 const records=rows();document.querySelector('#issue-count').textContent=records.length;
 document.querySelector('#list').innerHTML=groupOrder.map(s=>{const group=records.filter(r=>status(r)===s);if(!group.length)return '';return '<div class="group">'+names[s]+' <span class="mono">'+group.length+'</span></div>'+group.map(r=>'<button class="record" aria-pressed="'+(selected===r.n)+'" data-id="'+r.n+'">'+mark(s)+'<span class="entry"><span class="mono">LU-'+r.n+(r.n===32?icon('pin'):'')+(r.n===34?'<span class="urgentflag">Critical</span>':'')+'</span><strong>'+esc(r.title)+'</strong></span></button>').join('')}).join('')||'<p class="empty">No matching issues.</p>';
 document.querySelectorAll('[data-scope]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.scope===scope));
}
function events(r){const timeline=r.history.map(([at,s],i)=>({title:i?'Status changed':'Issue created',at:-at,kind:i?'status':'plus',from:i?r.history[i-1][1]:null,to:s}));if(r.n===32||r.changed)timeline.push({title:'Checkpoint saved',at:r.changed?0:1,kind:'pin'});return timeline.reverse()}
function context(r){
 if(tab==='history'){const entries=events(r).map(e=>'<div class="context-entry"><span class="node">'+icon(e.kind)+'</span><div class="event-title">'+e.title+' <time>'+ages(e.at)+'</time></div>'+(e.to?'<div class="difference">'+(e.from?mark(e.from)+names[e.from]+icon('arrow'):'')+mark(e.to)+names[e.to]+'</div>':'<div class="difference">Next action updated</div>')+'</div>').join('');return r.n!==32?entries:'<div class="context-pair"><div>'+entries+'</div><aside class="source-preview"><p class="label">Source note</p><button class="source-open" data-tab="notes">'+icon('note')+'Link resolution '+icon('arrow')+'</button><p>Rebuild outgoing links after a rename so a note no longer appears in its old backlinks.</p><div class="path">decisions/link-resolution.md</div></aside></div>'}
 if(tab==='notes')return '<div class="note"><div class="row">'+icon('note')+'<h3>Link resolution</h3></div><p>Rebuild outgoing links after a rename so a note no longer appears in its old backlinks.</p><div class="stamp mono">decisions/link-resolution.md</div></div>';
 return '<p class="empty">No linked notes.</p>';
}
function details(r){if(!r){document.querySelector('#paper').innerHTML='<p class="empty">Choose an issue to read its details.</p>';document.querySelector('#ref').textContent='';document.querySelector('#position').textContent='0 / 0';document.querySelector('#edited').textContent='';return}
 const s=status(r),n=r.n,day=r.changed?0:r.n===32?1:-r.history.at(-1)[0],i=rows().findIndex(x=>x.n===r.n);
 document.querySelector('#ref').textContent='LU-'+n;document.querySelector('#position').textContent=(i+1)+' / '+rows().length;document.querySelector('#edited').textContent='Updated '+ages(day).toLowerCase();
 document.querySelector('#paper').innerHTML='<div class="eyebrow">'+icon(r.kind==='bug'?'bug':'type')+' LU-'+n+'</div><h1>'+esc(r.title)+'</h1>'+(descriptions[n]?'<p class="description">'+descriptions[n]+'</p>':'')+'<div class="properties"><span>'+mark(s)+names[s]+'</span><span>'+icon('priority')+priority(n)+' priority</span><span>'+icon(r.kind==='bug'?'bug':'type')+kinds[r.kind]+'</span></div>'+(r.next||s!=='done'?'<section class="action"><div class="action-head row">'+icon('turn')+'<h2>Next action</h2>'+(editing?'':'<button id="edit">'+icon('pencil')+'Edit</button>')+'</div>'+(editing?'<form class="edit-area"><textarea aria-label="Next action" required maxlength="2000">'+esc(r.next)+'</textarea><div class="edit-buttons"><button class="save">Save checkpoint</button><button type="button" id="cancel">Cancel</button></div></form>':'<p>'+esc(r.next||'No next action saved.')+'</p>'+((n===32||r.changed)?'<div class="stamp">'+icon('pin')+'Checkpoint saved '+ages(day).toLowerCase()+'</div>':''))+'</section>':'')+'<div class="context-tabs"><button data-tab="history" aria-pressed="'+(tab==='history')+'">History <span class="mono">'+events(r).length+'</span></button>'+(n===32?'<button data-tab="notes" aria-pressed="'+(tab==='notes')+'">Linked notes <span class="mono">1</span></button>':'')+'</div><section id="context">'+context(r)+'</section>';
 if(editing)document.querySelector('textarea').focus();
}
function draw(){renderList();details(current());}
function choose(n,mobile=true){selected=n;tab='history';editing=false;if(mobile)document.body.classList.remove('show-list');draw();document.querySelector('.sheet').scrollTop=0;}
function step(n){let a=rows(),i=a.findIndex(x=>x.n===selected);if(!a.length)return;choose(a[(i+n+a.length)%a.length].n);document.querySelector('.record[aria-pressed="true"]')?.scrollIntoView({block:'nearest'})}
function search(open){const box=document.querySelector('.search-panel');box.hidden=!open;if(open){document.body.classList.add('show-list');box.querySelector('input').focus()}else{box.querySelector('input').value='';term='';if(!current())selected=rows()[0]?.n;draw()}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.scope){scope=b.dataset.scope;const first=rows()[0];choose(first?.n,false)}if(b.dataset.id)choose(Number(b.dataset.id));if(b.dataset.tab){tab=b.dataset.tab;details(current())}if(b.id==='edit'||b.id==='cancel'){editing=b.id==='edit';details(current())}if(b.id==='prev'||b.id==='next')step(b.id==='prev'?-1:1);if(b.id==='find'||b.id==='close-search')search(b.id==='find');if(b.id==='back')document.body.classList.add('show-list')});
document.querySelector('.search-panel input').addEventListener('input',e=>{term=e.target.value.toLowerCase().trim();if(!rows().some(r=>r.n===selected)){selected=rows()[0]?.n;tab='history';editing=false}draw()});
document.addEventListener('submit',e=>{if(!e.target.matches('.edit-area'))return;e.preventDefault();const value=e.target.querySelector('textarea').value.trim();if(!value)return;current().next=value;current().changed=true;editing=false;draw()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(editing){editing=false;details(current())}else if(!document.querySelector('.search-panel').hidden)search(false);return}if(e.target.matches('input,textarea'))return;if(e.key==='/'){e.preventDefault();search(true)}if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();step(e.key==='ArrowUp'?-1:1)}});
draw();
</script></body></html>
