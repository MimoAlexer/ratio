function inspectorMarkup(state) {
  if (!Object.hasOwn(evInspectorItems, state.selected)) return '';
  const item = evInspectorItems[state.selected];
  const date = item.calendar ? '<time datetime="' + item.calendar + '">' + item.date + '</time>' : item.date;
  return '<aside class="ev-inspector" aria-label="' + item.name + ' details"><div class="ev-insp-layout"><div class="ev-insp-ident">' +
    '<div class="ev-insp-meta">' + evStatus(item.status, item.tone) + '<span>' + item.when + ' ' + date + '</span></div><h2 class="ev-title">' + item.name + '</h2></div>' +
    '<div class="ev-insp-body"><p class="ev-description">' + item.desc + '</p><div class="ev-insp-links">' + item.links.map(args=>evLink(...args)).join('') + '</div></div>' +
    '<button type="button" data-close-inspector class="ev-close" title="Close inspector" aria-label="Close inspector">' + evIcon('close') + '</button></div></aside>';
}
function handleEvidence(event, state, root, rerender) {
  const button = event.target.closest && event.target.closest('[data-ev-issue],[data-ev-note],[data-ev-filter]');
  if (!button || !root.contains(button)) return false;
  let focusSelector = null;
  if (button.hasAttribute('data-ev-issue')) {
    const key = button.getAttribute('data-ev-issue');
    if (!Object.hasOwn(evIssues, key)) return false;
    state.issue = key; state.view = 'work'; state.selected = null;
    focusSelector = '.ev-detail .ev-title';
  } else if (button.hasAttribute('data-ev-note')) {
    const key = button.getAttribute('data-ev-note');
    if (!Object.hasOwn(evNotes, key)) return false;
    state.note = key; state.view = 'notes'; state.selected = null;
    focusSelector = '.ev-notepage .ev-title';
  } else {
    state.healthFilter = button.getAttribute('data-ev-filter') === 'attention' ? 'attention' : 'all';
    focusSelector = '[data-ev-filter="' + state.healthFilter + '"]';
  }
  rerender();
  const nextFocus = root.querySelector(focusSelector);
  if (nextFocus) {
    if (nextFocus.tagName === 'H2') nextFocus.tabIndex = -1;
    nextFocus.focus({preventScroll:true});
    if (nextFocus.tagName === 'H2' && root.getBoundingClientRect().width < 640) nextFocus.scrollIntoView({block:'nearest'});
  }
  return true;
}

const swRoutes = {
  roadmap:'Timeline', release:'Burnup', cycle:'Cycle time', work:'Issues', notes:'Notes', health:'Project health'
};
const swPlans = ['roadmap','release','cycle'];
const swMilestones = ['index','migration','security','beta','release'];
const swDefault = {version:4,view:'roadmap',range:'weeks',links:true,selected:'beta',issue:'index',note:'backlinks',healthFilter:'all'};
function swRestore(saved) {
  const s = {...swDefault,analytics:{}};
  if (saved?.version!==4) return s;
  const choices = {view:Object.keys(swRoutes),range:['weeks','month'],selected:[null,...swMilestones],issue:['index','migration','security'],note:Object.keys(evNotes),healthFilter:['all','attention']};
  for(const [key,values] of Object.entries(choices)) if(values.includes(saved[key])) s[key]=saved[key];
  if(typeof saved.links==='boolean')s.links=saved.links;
  const a=saved.analytics;
  if(a&&typeof a==='object')for(const k of ['weeks','kind','issue','manifest','pace','scope','checkpoint']){
    if(typeof a[k]==='string'&&/^[\w .–:/-]{1,48}$/.test(a[k]))s.analytics[k]=a[k];
  }
  return s;
}
function swPage(s) {
  const plan=swPlans.includes(s.view);
  const title=s.view==='cycle'?'Project activity':plan?'Release 1.4':{work:'My issues',notes:'Decision notes',health:'Project health'}[s.view];
  const context=plan?'<div class="sw-context"><button class="sw-act" type="button" data-ev-issue="index" title="Resume the backlink regression">'+swIcon('corner-up-right')+'<span>Resume</span> <span class="sw-id">LU-32</span></button><button class="sw-act sw-critical" type="button" data-ev-issue="security"><i class="sw-risk-dot" aria-hidden="true"></i><span>1 critical alert</span></button></div>':'';
  const heading='<div class="sw-pagehead"><h1>'+title+'</h1>'+context+'</div>';
  const modes=plan?'<nav class="sw-modes" aria-label="Planning views">'+swPlans.map(k=>'<button type="button" data-view="'+k+'" '+(s.view===k?'aria-current="page"':'')+'>'+swRoutes[k]+'</button>').join('')+'</nav>':'';
  const inspector=s.selected&&swMilestones.includes(s.selected)?inspectorMarkup(s):'';
  let content;
  if(s.view==='roadmap')content=roadmapMarkup(s,modes)+inspector;
  else if(plan)content=analyticsMarkup(s,s.view);
  else content=evidenceMarkup(s,s.view)+inspector;
  return heading+(s.view==='roadmap'?'':modes)+'<div class="sw-sheet">'+content+'</div>';
}
function swSkeleton(s, brand){
  const active=swPlans.includes(s.view)?'roadmap':s.view;
  const nav=[['roadmap','Planning'],['work','Issues'],['notes','Notes'],['health','Health']].map(([k,label])=>
    '<button type="button" data-view="'+k+'"'+(active===k?' aria-current="location"':'')+'>'+label+'</button>').join('');
  return '<div class="sw-app"><header class="sw-top">'+brand+'<nav class="sw-nav" aria-label="Ratio workspace">'+nav+'</nav><button type="button" class="sw-find" data-find aria-expanded="false" aria-controls="sw-find" aria-label="Find pages and issues">'+swIcon('search')+'<span>Find</span><kbd aria-hidden="true">/</kbd></button><section id="sw-find" class="sw-pop" data-pop="find" aria-label="Find pages and issues" hidden></section></header><main class="sw-main" data-content>'+swPage(s)+'</main><footer class="sw-footer"><span>Sample workspace</span><time datetime="2026-11-20">20 Nov 2026</time></footer></div>';
}
function swMount(root){

  if (!document.title) document.title = 'Ratio · Luma release workspace';
  let state=swRestore(window.openai?.widgetState?.privateContent);
  const standalone=root.hasAttribute('data-standalone');
  const aliases={burnup:'release',evidence:'work',home:'roadmap',report:'release'};
  function urlView(){const slug=window.location.hash.slice(1);return Object.hasOwn(swRoutes,slug)?slug:aliases[slug];}
  if(standalone&&urlView()){state.view=urlView();state.selected=state.view==='roadmap'?'beta':null}
  const session=Math.random().toString(36).slice(2);let sequence=0,findOpen=false;
  const commands=[...Object.entries(swRoutes).map(([k,label])=>({label,view:k})),...Object.entries(evIssues).map(([k,r])=>({label:r.id+' · '+r.title,issue:k}))];
  function results(text){return commands.filter(x=>x.label.toLowerCase().includes(text.trim().toLowerCase())).map(x=>'<button type="button" class="sw-result" '+(x.issue?'data-ev-issue="'+x.issue+'"':'data-view="'+x.view+'"')+'>'+x.label+'</button>').join('')||'<p class="sw-empty">No matches.</p>';}
  function renderFind(focus) {
    const panel = root.querySelector('[data-pop="find"]');
    panel.hidden = !findOpen;
    root.querySelector('[data-find]').setAttribute('aria-expanded', String(findOpen));
    if (!findOpen) return;
    const close = '<button type="button" data-dismiss class="sw-dismiss" aria-label="Close">'+swIcon('x')+'</button>';
    panel.innerHTML = '<div class="sw-pop-head"><span>Find</span>'+close+'</div><input type="search" aria-label="Search pages and issues" placeholder="Page or issue"><div data-results>'+results('')+'</div>';
    if (focus) panel.querySelector('input').focus({preventScroll:true});

    renderFind(true);
  }

    renderFind(false);
    if (focus) root.querySelector('[data-find]').focus({preventScroll:true});
  }
  function draw(){root.innerHTML=swSkeleton(state, brand);if(findOpen)renderFind(false);}
  function save(){

    if(typeof window.openai?.setWidgetState==='function'){
      try{Promise.resolve(window.openai.setWidgetState({modelContent:{view:state.view,selected:state.selected,brand:'Ratio'},privateContent:{...state,session,sequence:++sequence}})).catch(()=>{});}catch{}

  }

    if(el.hasAttribute('data-dismiss')){closeFind(true);return;}
    if(el.dataset.view){go(el.dataset.view);return;}
    if(el.dataset.range){state.range=el.dataset.range==='month'?'month':'weeks';render();root.querySelector('[data-range="'+state.range+'"]')?.focus({preventScroll:true});return;}
    if(el.hasAttribute('data-links')){state.links=!state.links;render();root.querySelector('[data-links]')?.focus({preventScroll:true});return;}
    if(el.dataset.inspect){inspect(el.dataset.inspect);return;}
    if(el.hasAttribute('data-close-inspector'))closeInspector();

  root.addEventListener('input',e=>{if(e.target.matches('[data-pop="find"] input'))root.querySelector('[data-results]').innerHTML=results(e.target.value);});
  document.addEventListener('pointerdown',e=>{if(findOpen&&!e.target.closest?.('[data-pop],[data-find]'))closeFind(false);});
  if(standalone)document.addEventListener('keydown',e=>{
    if(root.contains(e.target)||e.target.closest?.('input,textarea,select,[contenteditable=true]'))return;
    if(e.key==='/'||((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k')){e.preventDefault();openFind();}
  });
  if(standalone)window.addEventListener('popstate',()=>{state.view=urlView()||'roadmap';state.selected=state.view==='roadmap'?'beta':null;findOpen=false;draw()});
  window.addEventListener('openai:set_globals',e=>{const prefs=e.detail?.globals?.widgetState?.privateContent;if(!root.isConnected||prefs?.version!==4||(prefs.session===session&&prefs.sequence<=sequence))return;state=swRestore(prefs);findOpen=false;draw();});
  draw();
}

})();
