<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect to Ratio</title>
  <style>
    :root {
      color-scheme: dark;
      --canvas: #171717;
      --canvas-light: linear-gradient(180deg, #0a0a0a 0%, #111 24%, #222 46%, #3a3a3a 69%, #484848 100%);
      --field: #131313;
      --ink: #f0f0f0;
      --secondary: #c5c5c5;
      --muted: #a6a6a6;
      --line: rgb(240 240 240 / 14%);
      --control-line: #7c7c7c;
      --edge-dark: rgb(0 0 0 / 32%);
      --edge-light: rgb(255 255 255 / 6%);
      --focus: #dadada;
      --button: #e4e4e4;
      --button-hover: #f3f3f3;
      --button-text: #191919;
      --sans: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
      --control: 38px;
      --radius: 4px;
      font: 400 100%/1.5 var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --canvas: #e8e8e8;
        --canvas-light: linear-gradient(180deg, #d7d7d7 0%, #dedede 24%, #e6e6e6 46%, #f0f0f0 69%, #f7f7f7 100%);
        --field: #f6f6f6;
        --ink: #1c1c1c;
        --secondary: #515151;
        --muted: #626262;
        --line: rgb(0 0 0 / 16%);
        --control-line: #808080;
        --edge-dark: #cbcbcb;
        --edge-light: #fff;
        --focus: #545454;
        --button: #252525;
        --button-hover: #121212;
        --button-text: #fafafa;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink); font-size: .875rem;
      background: var(--canvas) var(--canvas-light) no-repeat;
    }
    main {
      width: min(100%, 29rem); margin-inline: auto;
      padding: clamp(52px, 18vh, 160px) 24px 32px;
    }
    .brand {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 24px; padding-bottom: 13px; border-bottom: 1px solid var(--line);
      font-size: 1.125rem; line-height: 1; font-weight: 650; letter-spacing: -.045em;
    }
    .mark, .mark svg { width: 27px; height: 27px; display: block; }
    .desktop-controls {
      display: grid; place-items: center; width: 36px; height: 36px; margin-inline-start: auto;
      border: 0; border-radius: var(--radius); padding: 0; background: transparent; color: var(--secondary);
    }
    .desktop-controls:hover, .desktop-controls:focus-visible { background: var(--line); color: var(--ink); }
    .desktop-controls svg { width: 19px; height: 19px; fill: currentColor; }
    h1 { margin: 0; font-size: 1.625rem; font-weight: 620; line-height: 1.25; letter-spacing: -.035em; }
    .intro { margin: 8px 0 20px; color: var(--secondary); }
    form { margin: 0; }
    label { display: block; margin-bottom: 6px; font-size: .8125rem; font-weight: 600; }
    .controls { display: grid; gap: 12px; }
    input, button { font: inherit; }
    input {
      min-width: 0; width: 100%; min-height: var(--control); padding: 7px 10px;
      border: 1px solid var(--control-line); border-radius: var(--radius); color: var(--ink); background: var(--field);
      box-shadow: inset 0 1px 2px var(--edge-dark), 0 1px var(--edge-light);
      font: 400 .8125rem/1.5 var(--mono);
    }
    input::placeholder { color: var(--muted); opacity: 1; }
    :where(input, button, summary):focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    button, summary { cursor: pointer; }
    .submit {
      min-height: var(--control); padding: 7px 16px; border: 1px solid var(--button); border-radius: var(--radius);
      color: var(--button-text); background: var(--button); font-size: .8125rem; font-weight: 600;
      box-shadow: inset 0 -1px rgb(0 0 0 / 15%), 0 1px var(--edge-dark);
    }
    .submit:hover, .submit:active { background: var(--button-hover); border-color: var(--button-hover); }
    .submit:active { box-shadow: inset 0 1px 2px rgb(0 0 0 / 25%); }
    .feedback {
      margin: 0; padding-inline-start: 12px; border-inline-start: 2px solid var(--control-line);
      color: var(--ink); font-size: .875rem; overflow-wrap: anywhere;
    }
    /* Keep the live region in the accessibility tree before the first response. */
    .feedback:empty {
      position: absolute; width: 1px; height: 1px; padding: 0; border: 0;
      overflow: hidden; clip-path: inset(50%);
    }
    .actions { display: flex; flex-wrap: wrap; gap: 0 16px; margin-top: 8px; }
    .text-button {
      min-height: 32px; padding: 4px 0; border: 0; background: transparent; color: var(--secondary);
      font-size: .8125rem; text-decoration: underline; text-decoration-color: var(--control-line); text-underline-offset: 3px;
    }
    .text-button:hover, summary:hover { color: var(--ink); }
    .local-demo { margin-top: 8px; }
    .help { margin-top: 16px; color: var(--secondary); font-size: .8125rem; }
    summary { width: fit-content; min-height: 32px; padding-block: 6px; }
    .help p { margin: 0 0 4px; overflow-wrap: anywhere; }
    code { color: var(--ink); font: 400 .95em/1.5 var(--mono); }
    @media (max-width: 600px), (pointer: coarse) {
      :root { --control: 44px; }
      .desktop-controls { width: 44px; height: 44px; }
      .text-button, summary { min-height: 44px; padding-block: 12px; }
    }
    @media (max-width: 520px), (max-height: 600px) {
      main { padding-block-start: clamp(28px, 9vh, 76px); }
    }
    @media (forced-colors: active) {
      body { background: Canvas; }
      .desktop-controls { color: ButtonText; }
    }
  </style>
</head>
<body>
  <main>
    <header class="brand">
      <span class="mark" aria-hidden="true">{{MARK}}</span>Ratio
      <button type="button" id="desktop-controls" class="desktop-controls" aria-label="Desktop controls"
              aria-haspopup="menu" aria-keyshortcuts="F10" title="Desktop controls (F10)">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
      </button>
    </header>
    <h1>Workspace connection</h1>
    <p class="intro">Use the address where you open Ratio in your browser.</p>
    <form id="connection">
      <label for="origin">Workspace URL</label>
      <div class="controls">
        <input id="origin" name="origin" type="url" inputmode="url" autocapitalize="none"
               autocomplete="off" spellcheck="false" aria-describedby="feedback" aria-errormessage="feedback" required placeholder="https://workspace.example.com" value="{{ORIGIN}}">
        <p id="feedback" class="feedback" role="status" aria-live="polite">{{MESSAGE}}</p>
        <button class="submit" type="submit" aria-describedby="feedback"><span id="verb">Connect</span></button>
      </div>
    </form>
    <div class="actions" id="saved" {{SAVED_HIDDEN}}>
      <button type="button" class="text-button" id="change">Use another address</button>
      <button type="button" class="text-button" id="forget">Forget saved address</button>
    </div>
    <button type="button" class="text-button local-demo" id="demo" data-origin="{{DEMO_ORIGIN}}" {{DEMO_HIDDEN}}>Open local demo</button>
    <details class="help">
      <summary>Where do I find my workspace URL?</summary>
      <p>Use your server’s HTTPS address without a page path. For a server on this computer, you can also enter a local address and port, such as <code>http://127.0.0.1:3000</code>.</p>
    </details>
  </main>
  <script>
    "use strict";
    const form = document.getElementById("connection");
    const field = document.getElementById("origin");
    const feedback = document.getElementById("feedback");
    const change = document.getElementById("change");
    const demo = document.getElementById("demo");
    const verb = document.getElementById("verb");
    const savedOrigin = field.defaultValue;
    const startingMessage = feedback.textContent;
    function showMessage(text) {
      feedback.textContent = text;
      field.removeAttribute("aria-invalid");
    }
    function showInvalidAddress(text) {
      showMessage(text);
      field.setAttribute("aria-invalid", "true");
      field.focus();
    }
    function updateAction() {
      const sameAddress = savedOrigin && field.value.trim() === savedOrigin;
      verb.textContent = sameAddress && startingMessage ? "Retry connection" : "Connect";
      change.hidden = !sameAddress;
    }
    function send(message, progress) {
      if (!window.ipc || typeof window.ipc.postMessage !== "function") {
        showMessage("Open the Ratio desktop app to connect.");
        return;
      }
      if (progress) showMessage(progress);
      window.ipc.postMessage(JSON.stringify(message));
    }
    document.getElementById("desktop-controls").addEventListener("click", () => send({action: "controls"}));
    field.addEventListener("input", () => {
      updateAction();
      showMessage(field.value.trim() === savedOrigin ? startingMessage : "");
    });
    form.addEventListener("submit", event => {
      event.preventDefault();
      send({action: "connect", origin: field.value.trim()}, "Opening workspace…");
    });
    change.addEventListener("click", () => {
      field.value = "";
      updateAction();
      showMessage("");
      field.focus();
    });
    document.getElementById("forget").addEventListener("click", () => {
      send({action: "forget"}, "Forgetting saved address…");
    });
    demo.addEventListener("click", () => {
      if (!demo.hidden && demo.dataset.origin) send({action: "connect", origin: demo.dataset.origin}, "Opening local demo…");
    });
    updateAction();
    if (savedOrigin && startingMessage) {
      // Let the loaded page reach assistive technology before moving focus to Retry.
      window.addEventListener("load", () => {
        requestAnimationFrame(() => requestAnimationFrame(() => {
          if (document.activeElement === document.body) form.querySelector(".submit").focus();
        }));
      }, {once: true});
    } else {
      field.focus();
    }
  </script>
</body>
</html>
