[package]
name = "ratio"
version = "0.4.1"
edition = "2024"
rust-version = "1.90"
publish = false
description = "Ratio — a desktop issue tracker for solo developers"

[dependencies]
dirs = "6"
muda = { version = "0.20", default-features = false, features = ["gtk3"] }
open = { version = "5", features = ["shellexecute-on-windows"] }
rfd = { version = "0.16", default-features = false, features = ["gtk3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tao = "0.37"
tempfile = "3"
url = "2"
wry = "0.57"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = { version = "2", features = ["v2_40"] }

[target.'cfg(target_os = "windows")'.dependencies]
dunce = "1.0"
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
opt-level = 2
strip = true

[build-dependencies]
tauri-winres = "0.3.6"
